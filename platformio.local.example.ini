; Copy to platformio.local.ini for local overrides (that file is gitignored).
;
; Cold builds of the simulator envs fail with the fetched crossink-simulator
; package: the LDF's chain mode trips on the simulator<->Logging include cycle
; and drops the package's include path for lib/Memory and lib/MiniBidi
; ("Arduino.h file not found"). Passing the path globally fixes those units
; without disturbing the rest of the LDF graph (deep+/chain+ break JPEGDEC
; include resolution instead). build_flags replaces the platformio.ini value,
; so each env's own defines are replicated here.
;
; CI copies this file verbatim before building the simulator (see the
; integration job in .github/workflows/ci.yml).
;
; On Linux/WSL the simulator needs two more link flags. They cannot be listed
; below, because the macOS linker accepts neither: -lcrypto, since the
; simulator computes MD5 with OpenSSL there (CommonCrypto on macOS), and
; -Wl,--allow-multiple-definition, since GNU ld loads the simulator's
; firmware_link_stubs.cpp, which repeats definitions lib/Logging and lib/uzlib
; already carry. With libssl-dev installed, pass them the way CI does:
;   PLATFORMIO_BUILD_FLAGS="-lcrypto -Wl,--allow-multiple-definition" pio run -e simulator
[env:simulator]
build_flags =
  ${simulator-base.build_flags}
  -DCROSSINK_APP_CAP_TOUCH=0
  -DCROSSINK_APP_CAP_USB_DRIVE=0
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x3-x4\"
  -I.pio/libdeps/simulator/simulator/src

[env:simulator-X3]
build_flags =
  ${simulator-base.build_flags}
  -DCROSSINK_APP_CAP_TOUCH=0
  -DCROSSINK_APP_CAP_USB_DRIVE=0
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x3-x4\"
  -DSIMULATOR_DEVICE_X3
  -I.pio/libdeps/simulator-X3/simulator/src

[env:sticky-simulator]
build_flags =
  -DCROSSINK_SCALABLE_FONTS=1
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DFREEINK_FONT_ENABLE_NATIVE_HINTING=1
  -DFREEINK_FONT_ENABLE_MONOCHROME=1
  ${simulator-base.build_flags}
  -DSIMULATOR_DEVICE_STICKY
  -DFREEINK_DEVICE_STICKY=1
  -DCROSSINK_APP_CAP_TOUCH=1
  -DCROSSINK_APP_CAP_USB_DRIVE=0
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"sticky\"
  -I.pio/libdeps/sticky-simulator/simulator/src

[env:x4-pro-simulator]
build_flags =
  -DCROSSINK_SCALABLE_FONTS=1
  -DFREEINK_FONT_ENABLE_AUTOHINT=1
  -DFREEINK_FONT_ENABLE_NATIVE_HINTING=1
  -DFREEINK_FONT_ENABLE_MONOCHROME=1
  ${simulator-base.build_flags}
  -DSIMULATOR_DEVICE_X4_PRO
  -DCROSSINK_APP_CAP_TOUCH=1
  -DCROSSINK_APP_CAP_USB_DRIVE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-pro\"
  -I.pio/libdeps/x4-pro-simulator/simulator/src

[env:x4-classic-simulator]
build_flags =
  ${simulator-base.build_flags}
  -DSIMULATOR_DEVICE_X4_CLASSIC
  -DCROSSINK_APP_CAP_TOUCH=0
  -DCROSSINK_APP_CAP_USB_DRIVE=1
  -DCROSSINK_FIRMWARE_DEVICE_TYPE=\"x4-classic\"
  -I.pio/libdeps/x4-classic-simulator/simulator/src
