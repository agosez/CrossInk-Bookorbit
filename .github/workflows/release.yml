name: Compile Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Compile release builds"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      asset_version: ${{ steps.version.outputs.asset_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release tag is on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Resolve release version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          # scripts/rename_firmware.py sanitises the version for artifact names:
          # anything outside [A-Za-z0-9._-] becomes '-'. Semver build metadata such
          # as "+bookorbit.1" therefore reaches the filename as "-bookorbit.1", so
          # every artifact path below must use the sanitised form, not the version.
          ASSET_VERSION="$(printf '%s' "$VERSION" | sed 's/[^A-Za-z0-9._-]\{1,\}/-/g')"
          echo "asset_version=$ASSET_VERSION" >> "$GITHUB_OUTPUT"

  build-release:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
          - environment: picco
            firmware: firmware-picco
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: |
          set -euo pipefail
          # custom_sdkconfig runs a nested `pio run` from ~/.platformio/penv.
          # Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Configure release version
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
        run: |
          sed -i "/^\[crossink\]$/,/^\[/s/^version = .*/version = $RELEASE_VERSION/" platformio.ini

      - name: Build CrossInk
        env:
          CROSSINK_RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          CROSSINK_ASSET_BASE_URL: ${{ vars.CROSSINK_ASSET_BASE_URL }}
          CROSSINK_FONT_BASE_URL: ${{ vars.CROSSINK_FONT_BASE_URL }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-v${{ needs.prepare-release.outputs.asset_version }}.bin
          if-no-files-found: error

  # Upstream's prepare-language-assets job uploads the language and hyphenation
  # packs to its own S3 bucket. This fork publishes them to its gh-pages branch,
  # which GitHub Pages serves at the ASSET_DOWNLOAD_BASE_URL compiled into the
  # firmware (src/activities/settings/AssetDownloadActivity.cpp). Snapshots are
  # only added, never replaced, so older firmware keeps finding its own files.
  publish-language-assets:
    needs:
      - prepare-release
      - build-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One writer at a time on gh-pages, release candidates included. Never cancel a push.
    concurrency:
      group: language-assets-pages
      cancel-in-progress: false
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
      PAGES_DIR: ${{ runner.temp }}/pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check out the gh-pages branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add "$PAGES_DIR" FETCH_HEAD
          else
            git worktree add --detach "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout -q --orphan gh-pages
            git -C "$PAGES_DIR" rm -rq .
          fi
          # Serve every file as is; Jekyll would skip some snapshot paths.
          touch "$PAGES_DIR/.nojekyll"

      # Versions ending in -rc1 are not -RC builds: the firmware reads the stable channel.
      - name: Export language and hyphenation downloads
        run: |
          python3 scripts/export_pages_language_assets.py \
            --output "$PAGES_DIR/assets" --version "$RELEASE_VERSION" --channel stable

      - name: Push to gh-pages
        working-directory: ${{ env.PAGES_DIR }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll assets
          if git diff --cached --quiet; then
            echo 'Language downloads are already current'
            exit 0
          fi
          git commit -q -m "Update language downloads for v$RELEASE_VERSION"
          git push origin HEAD:refs/heads/gh-pages

  publish-release:
    needs:
      - prepare-release
      - build-release
      - publish-language-assets
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
      ASSET_VERSION: ${{ needs.prepare-release.outputs.asset_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-firmware-*
          merge-multiple: true
          path: release-firmware

      # Upstream also publishes a signed release catalog and the language editor
      # template to its GitHub Pages source here (scripts/generate_release_catalog.py).
      # This fork's updater reads the GitHub releases API directly
      # (CROSSINK_OTA_RELEASE_URL), and that step needs upstream's commit-signing
      # secret, so it is left out.
      # The SD zip stays as an offline alternative to Download Languages.
      - name: Package SD language files and editor template
        run: |
          python3 scripts/package_languages.py \
            --version "${{ env.RELEASE_VERSION }}" \
            --source-commit "${{ github.sha }}" --status release-build \
            --output "release-firmware/crossink-languages-${{ env.ASSET_VERSION }}.zip" \
            --template-output-dir "release-firmware/language-template"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          # A release candidate (version=1.6.1+bookorbit.5-rc1) goes out as a pre-release:
          # /releases/latest skips it, so only readers with Include Release Candidates on
          # are offered it over the air. contains() ignores case.
          prerelease: ${{ contains(env.RELEASE_VERSION, '-rc') }}
          files: |
            release-firmware/crossink-languages-${{ env.ASSET_VERSION }}.zip
            release-firmware/language-template/english_template.yaml
            release-firmware/language-template/language-template.json
            release-firmware/firmware-x3-x4-v${{ env.ASSET_VERSION }}.bin
            release-firmware/firmware-sticky-v${{ env.ASSET_VERSION }}.bin
            release-firmware/firmware-x4-pro-v${{ env.ASSET_VERSION }}.bin
            release-firmware/firmware-x4-classic-v${{ env.ASSET_VERSION }}.bin
            release-firmware/firmware-picco-v${{ env.ASSET_VERSION }}.bin
