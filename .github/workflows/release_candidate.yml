name: Compile Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    # Every matrix member builds the same source and computes the same tag.
    outputs:
      rc_tag: ${{ steps.metadata.outputs.rc_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: default
            firmware: firmware-x3-x4
          - environment: sticky
            firmware: firmware-sticky
          - environment: x4-pro
            firmware: firmware-x4-pro
          - environment: x4-classic
            firmware: firmware-x4-classic
          - environment: picco
            firmware: firmware-picco
    env:
      RC_BRANCH: ${{ github.ref_name }}
      RC_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Resolve release-candidate metadata
        id: metadata
        shell: bash
        run: |
          branch_without_prefix="${RC_BRANCH#release/}"
          branch_safe=$(printf '%s\n' "$branch_without_prefix" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          hash_short="${RC_HASH::7}"
          rc_tag="rc-${branch_safe}-${hash_short}"
          echo "rc_tag=$rc_tag" >> "$GITHUB_OUTPUT"
          echo "RC_BRANCH_RAW=$branch_without_prefix" >> "$GITHUB_ENV"
          echo "RC_BRANCH_SAFE=$branch_safe" >> "$GITHUB_ENV"
          echo "RC_HASH_SHORT=$hash_short" >> "$GITHUB_ENV"
          echo "RC_TAG=$rc_tag" >> "$GITHUB_ENV"
          echo "VERSION=${branch_safe}-RC" >> "$GITHUB_ENV"

      - name: Set version from branch
        shell: bash
        run: |
          # scripts/git_branch.py appends its own "-rc+<hash>" for the default env, so write
          # the bare branch name here. Fails loudly: a silent no-op ships the wrong version.
          python3 - "$RC_BRANCH_RAW" <<'PY'
          import re
          import sys

          version = sys.argv[1]
          path = 'platformio.ini'
          with open(path) as f:
              text = f.read()

          def set_in_section(section):
              return re.sub(r'(?m)^version\s*=.*$', f'version = {version}', section, count=1)

          new_text, count = re.subn(
              r'(?ms)^\[crossink\]\n.*?(?=^\[|\Z)', lambda m: set_in_section(m.group(0)), text, count=1
          )
          if count != 1 or f'version = {version}' not in new_text:
              sys.exit(f'could not set [crossink] version in {path}')

          with open(path, 'w') as f:
              f.write(new_text)
          PY
          grep -A1 '^\[crossink\]' platformio.ini

      - name: Build CrossInk
        shell: bash
        env:
          CROSSINK_RELEASE_VERSION: "1"
          CROSSINK_ASSET_BASE_URL: ${{ vars.CROSSINK_ASSET_BASE_URL }}
          CROSSINK_FONT_BASE_URL: ${{ vars.CROSSINK_FONT_BASE_URL }}
          CROSSINK_RC_BRANCH: ${{ env.RC_BRANCH_RAW }}
          CROSSINK_RC_HASH: ${{ env.RC_HASH_SHORT }}
        run: pio run -j1 -e ${{ matrix.environment }}

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/${{ matrix.firmware }}-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
          if-no-files-found: error

  # Language and hyphenation downloads for -RC firmware, which reads the rc channel.
  # Same gh-pages publication as release.yml's publish-language-assets job.
  publish-language-assets:
    if: startsWith(github.ref_name, 'release/')
    needs: build-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: language-assets-pages
      cancel-in-progress: false
    env:
      RC_TAG: ${{ needs.build-release-candidate.outputs.rc_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check out the gh-pages branch
        run: |
          # A job's env cannot read the runner context, so later steps get it here.
          PAGES_DIR="$RUNNER_TEMP/pages"
          echo "PAGES_DIR=$PAGES_DIR" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages
            git worktree add "$PAGES_DIR" FETCH_HEAD
          else
            git worktree add --detach "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout -q --orphan gh-pages
            git -C "$PAGES_DIR" rm -rq .
          fi
          touch "$PAGES_DIR/.nojekyll"

      - name: Export language and hyphenation downloads
        run: |
          python3 scripts/export_pages_language_assets.py \
            --output "$PAGES_DIR/assets" --version "$RC_TAG" --channel rc

      - name: Push to gh-pages
        run: |
          cd "$PAGES_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .nojekyll assets
          if git diff --cached --quiet; then
            echo 'Language downloads are already current'
            exit 0
          fi
          git commit -q -m "Update language downloads for $RC_TAG"
          git push origin HEAD:refs/heads/gh-pages

  publish-release-candidate:
    if: startsWith(github.ref_name, 'release/')
    needs:
      - build-release-candidate
      - publish-language-assets
    runs-on: ubuntu-latest
    env:
      RC_BRANCH: ${{ github.ref_name }}
      RC_HASH: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release-candidate metadata
        shell: bash
        run: |
          branch_without_prefix="${RC_BRANCH#release/}"
          branch_safe=$(printf '%s\n' "$branch_without_prefix" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')
          hash_short="${RC_HASH::7}"
          rc_tag="rc-${branch_safe}-${hash_short}"
          echo "RC_BRANCH_RAW=$branch_without_prefix" >> "$GITHUB_ENV"
          echo "RC_BRANCH_SAFE=$branch_safe" >> "$GITHUB_ENV"
          echo "RC_HASH_SHORT=$hash_short" >> "$GITHUB_ENV"
          echo "RC_TAG=$rc_tag" >> "$GITHUB_ENV"

      - name: Download firmware artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-candidate-firmware-*
          merge-multiple: true
          path: release-candidate-firmware

      - name: Package SD language files
        run: |
          python3 scripts/package_languages.py \
            --version "${{ env.RC_TAG }}" \
            --source-commit "${{ github.sha }}" --status release-build \
            --output "release-candidate-firmware/crossink-languages-${{ env.RC_TAG }}.zip" \
            --template-output-dir "release-candidate-firmware/language-template"

      - name: Create GitHub RC Prerelease
        uses: softprops/action-gh-release@v3
        with:
          # No token: the action defaults to this workflow's GITHUB_TOKEN, which
          # the permissions block above already grants write access to releases.
          # Upstream passes its own RELEASE_PAT here so that publishing can push
          # to its default branch; this fork does not publish a release catalog.
          tag_name: ${{ env.RC_TAG }}
          target_commitish: ${{ github.sha }}
          name: RC ${{ env.RC_BRANCH_SAFE }} ${{ env.RC_HASH_SHORT }}
          body: |
            Draft release candidate build from `release/${{ env.RC_BRANCH_RAW }}` at `${{ env.RC_HASH_SHORT }}`.
          draft: true
          prerelease: true
          files: |
            release-candidate-firmware/crossink-languages-${{ env.RC_TAG }}.zip
            release-candidate-firmware/language-template/english_template.yaml
            release-candidate-firmware/language-template/language-template.json
            release-candidate-firmware/firmware-x3-x4-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
            release-candidate-firmware/firmware-sticky-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
            release-candidate-firmware/firmware-x4-pro-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
            release-candidate-firmware/firmware-x4-classic-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
            release-candidate-firmware/firmware-picco-${{ env.RC_BRANCH_SAFE }}-${{ env.RC_HASH_SHORT }}-RC.bin
